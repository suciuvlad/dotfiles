 fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">F</text></g></g>
<g><text x="136" y="236" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="17">manifest</text><text x="288" y="236" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="17">renderer</text><text x="440" y="236" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="17">cost</text><text x="592" y="236" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="17">input</text><text x="744" y="236" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="17">fences</text><text x="896" y="236" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="17">ship</text></g>
<text x="530" y="309" text-anchor="middle" fill="#8B7355" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="3">PER-CHANGE LOOP</text>
<circle cx="530" cy="374" r="132" fill="none" stroke="#8B7355" stroke-width="1.2" opacity="0.42">
  <animate attributeName="opacity" values="0.22;0.56;0.22" dur="7s" repeatCount="indefinite"/>
</circle>
<text x="530" y="375" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic">one loop</text>
<text x="530" y="404" text-anchor="middle" fill="#4a4a4a" font-family="Georgia, 'Times New Roman', serif" font-size="14">evidence at each slice</text>
<g>
  <g>
    <circle cx="530" cy="236" r="15" fill="#FAFAF7" stroke="#8B7355" stroke-width="1.2"><animate attributeName="opacity" values="0.72;1;0.72" dur="6s" begin="0s" repeatCount="indefinite"/></circle>

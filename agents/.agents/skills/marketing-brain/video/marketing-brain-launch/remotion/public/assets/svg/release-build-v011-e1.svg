    <text x="530" y="515" text-anchor="middle" fill="#1a1a1a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">4</text>
    <text x="530" y="544" text-anchor="middle" fill="#4a4a4a" font-family="Georgia, 'Times New Roman', serif" font-size="13">prove with tests</text>

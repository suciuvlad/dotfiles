    <circle cx="412" cy="442" r="15" fill="#FAFAF7" stroke="#8B7355" stroke-width="1.2"><animate attributeName="opacity" values="0.72;1;0.72" dur="6s" begin="0.88s" repeatCount="indefinite"/></circle>

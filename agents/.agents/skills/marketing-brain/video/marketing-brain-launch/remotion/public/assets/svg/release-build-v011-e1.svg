<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
          <title id="title">Marketing Brain v0.1.1 build ledger</title>
          <desc id="desc">An editorial replacement for the old dark build diagrams showing six slices and the five-step per-change loop.</desc>
          <rect width="1100" height="600" fill="#FAFAF7"/>

<rect x="24" y="24" width="1052" height="552" fill="none" stroke="#8B7355" stroke-width="1" opacity="0.34"/>
<rect x="38" y="38" width="1024" height="524" fill="none" stroke="#8B7355" stroke-width="1" opacity="0.18"/>
<text x="550" y="78" text-anchor="middle" fill="#8B7355" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="4">READ FIRST &#183; WRITE SECOND &#183; VERIFY THIRD</text>
<text x="550" y="120" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-style="italic">v0.1.1 build ledger</text>
<text x="550" y="148" text-anchor="middle" fill="#4a4a4a" font-family="Georgia, 'Times New Roman', serif" font-size="16">six bounded slices &#183; 16 of 22 findings closed &#183; raw 77 to projected B+</text>
<line x1="136" y1="182" x2="896" y2="182" stroke="#8B7355" stroke-width="1.2" opacity="0.58"/>

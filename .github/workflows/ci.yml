name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (setup, tests, install.sh, macoss, bootstrap.sh)
        run: make -C scripts lint

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe + defaults --verify tests
        run: make -C scripts test

  brewfile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Brewfile syntax
        run: brew bundle list --file=scripts/Brewfile >/dev/null
